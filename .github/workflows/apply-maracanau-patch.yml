name: Apply maracanau patch

on:
  push:
    paths:
      - 'maracanau-patch.diff'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harmonize-dashboards-complete
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset maracanau.html to main version and apply patch
        run: |
          git checkout 4a1bba3 -- maracanau.html
          git apply maracanau-patch.diff
          echo "Patch applied successfully"
          HASH=$(git hash-object maracanau.html)
          echo "File hash after patch: $HASH"
          if [ "$HASH" != "cc9e58fddc98e64c38dee862009b998066058b41" ]; then
            echo "ERROR: Hash mismatch! Expected cc9e58fddc98e64c38dee862009b998066058b41, got $HASH"
            exit 1
          fi
          echo "Hash verified successfully!"

      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add maracanau.html
          git commit -m "fix: apply correct maracanau.html (SHA cc9e58f)"
          git push

      - name: Cleanup temp files
        run: |
          git rm maracanau-patch.diff
          git rm .github/workflows/apply-maracanau-patch.yml
          git commit -m "cleanup: remove patch file and workflow"
          git push
