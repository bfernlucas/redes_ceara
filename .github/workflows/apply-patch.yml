name: Apply harmonization patch
on:
  push:
    branches: [fix/harmonize-v4]
    paths: ['.github/workflows/apply-patch.yml']
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/harmonize-v4
      - name: Apply patch
        run: |
          git apply harmonize-changes.patch
          rm harmonize-changes.patch
          rm test-mcp-direct.txt || true
          rm test-size.txt || true
          rm push-test.txt || true
          rm -rf .github/workflows/apply-patch.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "harmonizar dashboards: padronizar CSS com variáveis, filtro região aliment, active-filter OSC"
          git push
