name: Merge Maracanaú parts
on:
  push:
    branches: [harmonize-dashboards-complete]
    paths: ['_trigger_merge.txt']

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: harmonize-dashboards-complete
        
    - name: Concatenate parts
      run: |
        if [ -f "_maracanau_part2.tmp" ]; then
          cat maracanau.html _maracanau_part2.tmp > merged.html
          mv merged.html maracanau.html
          rm -f _maracanau_part2.tmp _trigger_merge.txt .github/workflows/merge-parts.yml
          wc -c maracanau.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harmonizar dashboard Maracanaú: melhorar economia, sociedade civil e síntese"
          git push
        fi
