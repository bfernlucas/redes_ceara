name: Merge file parts
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: harmonize-dashboards-complete
        
    - name: Concatenate file parts
      run: |
        if [ -f "_maracanau_part2.tmp" ]; then
          cat maracanau.html _maracanau_part2.tmp > maracanau_full.html
          mv maracanau_full.html maracanau.html
          rm _maracanau_part2.tmp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add maracanau.html _maracanau_part2.tmp
          git commit -m "Harmonizar dashboard Maracanaú: melhorar economia, sociedade civil e síntese"
          git push
          echo "File merged successfully"
        else
          echo "No part2 file found, nothing to do"
        fi
