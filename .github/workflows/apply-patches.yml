name: Apply patches
on:
  push:
    branches:
      - feat/capacity-radar
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/capacity-radar
          fetch-depth: 0
      - name: Apply patch to main
        run: |
          git checkout main
          git apply patches/capacity-radar.patch
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fortaleza.html maracanau.html
          git commit -m 'Adiciona Radar de Capacidade Institucional e padroniza CSS entre municípios'
          git push origin main
      - name: Cleanup
        run: |
          git checkout feat/capacity-radar
          git rm patches/capacity-radar.patch
          git rm .github/workflows/apply-patches.yml
          git commit -m 'chore: remove applied patches'
          git push origin feat/capacity-radar
