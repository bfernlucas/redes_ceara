name: Apply dashboard patches
on:
  push:
    paths:
      - 'patches/*.patch'
    branches: [main]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          for patch in patches/*.patch; do
            echo "Applying $patch"
            git apply "$patch" || echo "Patch $patch failed - may already be applied"
          done
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes to commit'
          else
            git add fortaleza.html maracanau.html
            git commit -m 'Apply dashboard harmonization patches'
            git push
            rm -rf patches/
            git add -A
            git commit -m 'chore: remove applied patches'
            git push
          fi
