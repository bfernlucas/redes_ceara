name: Apply patches
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: |
          git apply patches/capacity-radar.patch
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fortaleza.html maracanau.html
          git commit -m 'Adiciona Radar de Capacidade Institucional e padroniza CSS entre municípios'
          git push origin main
      - name: Cleanup
        run: |
          git rm patches/capacity-radar.patch
          git rm .github/workflows/apply-patches.yml
          git commit -m 'chore: remove applied patches'
          git push origin main
