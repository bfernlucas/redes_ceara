name: Combine maracanau.html parts
on:
  push:
    branches: [improvements/layout-sorting-standardization]
    paths: [_combine_trigger.txt]

permissions:
  contents: write

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improvements/layout-sorting-standardization
      - name: Combine parts
        run: |
          if [ -f "_maracanau_remaining.txt" ] && [ -f "maracanau.html" ]; then
            cat maracanau.html _maracanau_remaining.txt > maracanau_combined.html
            mv maracanau_combined.html maracanau.html
            rm -f _maracanau_remaining.txt _combine_trigger.txt test_size.txt test_large.txt
            rm -f .github/workflows/combine-maracanau.yml
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adiciona filtros de região/bairro nos mapas e padroniza template (Maracanaú)" || true
          git push
