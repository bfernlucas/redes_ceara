<head>

<title>Maracanaú — Diagnóstico Territorial · Redes Ceará</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<style>
:root{
  --bg:#F4F6F9;
  --panel:#FFFFFF;
  --panel-2:#F8FAFB;
  --text:#0B2B44;
  --muted:#5C6E7E;
  --line:#D8E0E8;
  --line-2:#E8EDF2;
  --brand:#7C3AED;
  --brand-2:#A855F7;
  --brand-3:#C084FC;
  --brand-4:#DDD6FE;
  --brand-5:#F3E8FF;
  --navy:#0B2B44;
  --teal:#2DD4BF;
  --gold:#C8952A;
  --green:#059669;
  --danger:#C0392B;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 3px 10px rgba(124,58,237,.07);
  --shadow-soft:0 1px 2px rgba(0,0,0,.04),0 2px 6px rgba(124,58,237,.04);
  --radius:6px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:'Open Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  background:#F4F6F9;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button,select,input,textarea{font:inherit}

/* Header */
.topbar{
  background:#6D28D9;
  color:#fff;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:1000;
  height:54px;
  display:flex;
  align-items:center;
  box-shadow:none;
  border-bottom:3px solid #4C1D95;
}
.topbar-inner{
  width:100%;
  max-width:1400px;
  margin:0 auto;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.brand-title{font-size:14px;font-weight:700;letter-spacing:-.01em;color:#fff!important}
.brand-sub{font-size:11px;color:rgba(255,255,255,.65)!important;margin-top:1px;line-height:1.4}
.header-badges{display:flex;gap:7px;flex-wrap:wrap}
.badge{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.22);
  border-radius:4px;
  padding:4px 10px;
  font-size:11px;
  font-weight:600;
}
